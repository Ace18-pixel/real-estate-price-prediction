<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Real Estate Price Predictor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        button {
            padding: 13px 30px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #ecfdf5;
            border: 1px solid #10b981;
            border-radius: 10px;
            text-align: center;
        }

        .result h2 {
            margin-bottom: 10px;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
            color: #047857;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏠 Real Estate Price Predictor</h1>

    <p class="subtitle">
        Predict the estimated sale price of a property using Machine Learning
    </p>

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">
                <label>Overall Quality (1–10)</label>
                <input type="number" name="quality" min="1" max="10" required>
            </div>

            <div class="form-group">
                <label>Living Area (sq ft)</label>
                <input type="number" name="living_area" required>
            </div>

            <div class="form-group">
                <label>Year Built</label>
                <input type="number" name="year_built" required>
            </div>

            <div class="form-group">
                <label>Year Remodeled</label>
                <input type="number" name="year_remodeled" required>
            </div>

            <div class="form-group">
                <label>Basement Area (sq ft)</label>
                <input type="number" name="basement_area" required>
            </div>

            <div class="form-group">
                <label>First Floor Area (sq ft)</label>
                <input type="number" name="first_floor_area" required>
            </div>

            <div class="form-group">
                <label>Second Floor Area (sq ft)</label>
                <input type="number" name="second_floor_area" required>
            </div>

            <div class="form-group">
                <label>Lot Area (sq ft)</label>
                <input type="number" name="lot_area" required>
            </div>

            <div class="form-group">
                <label>Garage Cars</label>
                <input type="number" name="garage_cars" min="0" required>
            </div>

            <div class="form-group">
                <label>Full Bathrooms</label>
                <input type="number" name="full_bath" min="0" required>
            </div>

            <div class="form-group">
                <label>Half Bathrooms</label>
                <input type="number" name="half_bath" min="0" required>
            </div>

            <div class="form-group">
                <label>Neighborhood</label>

                <select name="neighborhood" required>

                    <option value="">Select Neighborhood</option>

                    <option value="NAmes">North Ames</option>
                    <option value="CollgCr">College Creek</option>
                    <option value="OldTown">Old Town</option>
                    <option value="Edwards">Edwards</option>
                    <option value="Somerst">Somerset</option>
                    <option value="Gilbert">Gilbert</option>
                    <option value="NridgHt">Northridge Heights</option>
                    <option value="Sawyer">Sawyer</option>
                    <option value="NWAmes">Northwest Ames</option>
                    <option value="SawyerW">Sawyer West</option>
                    <option value="BrkSide">Brookside</option>
                    <option value="Crawfor">Crawford</option>
                    <option value="Mitchel">Mitchell</option>
                    <option value="NoRidge">Northridge</option>
                    <option value="Timber">Timberland</option>
                    <option value="IDOTRR">Iowa DOT/RR</option>
                    <option value="ClearCr">Clear Creek</option>
                    <option value="StoneBr">Stone Brook</option>
                    <option value="SWISU">South & West of Iowa State</option>
                    <option value="MeadowV">Meadow Village</option>
                    <option value="Blmngtn">Bloomington Heights</option>
                    <option value="BrDale">Briardale</option>
                    <option value="Veenker">Veenker</option>

                </select>
            </div>

        </div>

        <div class="button-container">

            <button type="submit">
                Predict House Price
            </button>

        </div>

    </form>

    {% if prediction is not none %}

    <div class="result">

        <h2>Estimated Property Value</h2>

        <div class="price">
            ${{ "{:,.2f}".format(prediction) }}
        </div>

    </div>

    {% endif %}

</div>

</body>
</html>
